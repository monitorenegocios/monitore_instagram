name: Atualizar Blog da Monitore

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Testar acesso ao RSS
        run: |
          curl -I -L -A "Mozilla/5.0" https://www.monitorenegocios.com.br/blogs/feed -o /tmp/rss.xml
          echo "RSS acessado com sucesso."

      - name: Atualizar posts e imagens do RSS do Zoho
        run: python3 scripts/update_blog.py

      - name: Commit das atualizações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet || git commit -m "chore: atualizar posts do blog"

      - name: Sincronizar e enviar atualizações
        run: |
          git pull --rebase origin main
          git push
